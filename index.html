<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>かわやまクイズ！</title>
    <style>
        :root {
            --main-pink: #ffafbd;
            --sub-orange: #ffc3a0;
            --accent-gold: #ffde59;
            --text-color: #5d5d5d;
        }

        body {
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
            background: linear-gradient(135deg, var(--main-pink), var(--sub-orange));
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-color);
            overflow-x: hidden;
        }

        #game-container {
            background: rgba(255, 255, 255, 0.95);
            width: 90%;
            max-width: 420px;
            padding: 30px 20px;
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
            text-align: center;
            position: relative;
        }

        .hidden { display: none; }
        h2 { color: #d63384; margin-bottom: 5px; }

        #days-count {
            font-size: 0.9em;
            color: #d63384;
            margin-bottom: 20px;
            font-weight: bold;
        }

        #slideshow-container {
            width: 100%;
            height: 300px;
            margin-bottom: 25px;
            position: relative;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            border: 4px solid white;
            background-color: #fdfdfd;
        }

        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 1.2s ease-in-out;
        }

        .slide.active { opacity: 1; }

        .photo-frame {
            width: 100%;
            max-height: 250px;
            object-fit: cover;
            border-radius: 15px;
            margin: 15px 0;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            border: 4px solid white;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            margin: 10px 0;
            border: none;
            border-radius: 50px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            background: white;
            border: 2px solid var(--main-pink);
            color: #d63384;
        }

        .btn:active:not(:disabled) { transform: scale(0.96); }
        .btn-choice:hover:not(:disabled) { background: var(--main-pink); color: white; }
        
        .btn:disabled {
            background: #eee;
            border-color: #ccc;
            color: #aaa;
            cursor: not-allowed;
        }

        .btn-next { background: #4caf50 !important; color: white !important; border: none !important; margin-top: 20px; }

        #feedback { font-size: 1.3em; font-weight: bold; margin: 10px 0; height: 1.5em; }
        #comment-text { font-size: 15px; line-height: 1.6; background: #fff5f7; padding: 15px; border-radius: 10px; margin-top: 5px; white-space: pre-wrap; }

        #scrolling-message { 
            font-size: 15px; 
            line-height: 1.8; 
            white-space: pre-wrap; 
            margin: 20px 0; 
            text-align: left; /* お手紙風に左寄せに変更 */
            color: #444;
        }
        
        .confetti { position: fixed; width: 8px; height: 8px; z-index: 1000; }

        #easter-egg-message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 30px 20px;
            border-radius: 15px;
            border: 3px solid var(--main-pink);
            z-index: 2000;
            font-weight: bold;
            color: #d63384;
            box-shadow: 0 0 30px rgba(0,0,0,0.3);
            font-size: 1.1em;
            line-height: 1.8;
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="course-select">
        <div id="slideshow-container"></div>
        <h2>かわやまクイズ！</h2>
        <div id="days-count"></div>
        <button class="btn btn-choice" onclick="startCourse('enkyori')">遠距離編</button>
        <button class="btn" disabled>準備中</button>
        <button class="btn" disabled>準備中</button>
    </div>

    <div id="quiz-screen" class="hidden">
        <p id="question-count" style="font-size: 0.8em; color: #999;"></p>
        <h3 id="question-text" style="margin: 20px 0;"></h3>
        <div id="answer-area" class="hidden">
            <div id="feedback"></div>
            <img id="quiz-image" class="photo-frame" src="" alt="思い出の写真">
            <div id="comment-text"></div>
            <button id="next-btn" class="btn btn-next" onclick="nextQuestion()">次に進む</button>
        </div>
        <div id="choices-area"></div>
    </div>

    <div id="result-screen" class="hidden">
        <h2 style="font-size: 1.6em;">Happy Birthday! 🎂</h2>
        <img src="images/final.jpg" class="photo-frame" style="border-color: var(--accent-gold);">
        <div id="scrolling-message">
もえへ

全問正解！！
そしてお誕生日おめでとう！！

このクイズを作るにあたって今までに撮った写真を振り返ってみたけど、遠距離の2年間でいろんな思い出が作れたね。
お互い大変なこともあったと思うけど、すごく充実した満足の2年間になったなと感じてます！

これからやっと一緒に過ごせるようになるね！
いろんな不安があると思うけど、これまで通り支え合って乗り越えていけるはず！

これからも一緒に歳を重ねていこうね！

作成者：やま
        </div>
        <button class="btn" style="background: var(--main-pink); color: white;" onclick="location.reload()">タイトルに戻る</button>
    </div>
</div>

<div id="easter-egg-message" class="hidden" onclick="this.classList.add('hidden')">
    出会ってくれてありがとう。<br>
    ずっと大切にするよ！<br><br>
    <span style="font-size: 0.7em; color: #bbb; font-weight: normal;">(タップして閉じる)</span>
</div>

<script>
    function updateDaysCount() {
        const start = new Date('2024-09-30');
        const today = new Date();
        const diffTime = today - start;
        const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
        document.getElementById('days-count').innerText = `今日で付き合って ${diffDays} 日目だね ♡`;
    }
    updateDaysCount();

    const titleImages = [
        'images/title1.jpg', 'images/title2.jpg', 'images/title3.jpg', 
        'images/title4.jpg', 'images/title5.jpg', 'images/title6.jpg',
        'images/title7.jpg', 'images/title8.jpg', 'images/title9.jpg',
        'images/title10.jpg', 'images/title11.jpg', 'images/title12.jpg',
        'images/title13.jpg', 'images/title14.jpg', 'images/title15.jpg',
        'images/title16.jpg', 'images/title17.jpg', 'images/title18.jpg'
    ];

    const slideshowContainer = document.getElementById('slideshow-container');
    titleImages.forEach((src, index) => {
        const img = document.createElement('img');
        img.src = src;
        img.className = 'slide' + (index === 0 ? ' active' : '');
        slideshowContainer.appendChild(img);
    });

    let slideIndex = 0;
    const slides = document.querySelectorAll('.slide');
    if(slides.length > 0) {
        setInterval(() => {
            slides[slideIndex].classList.remove('active');
            slideIndex = (slideIndex + 1) % slides.length;
            slides[slideIndex].classList.add('active');
        }, 2500);
    }

    let tapCount = 0;
    slideshowContainer.onclick = function() {
        tapCount++;
        if (tapCount === 3) {
            document.getElementById('easter-egg-message').classList.remove('hidden');
            createConfetti(50);
            tapCount = 0;
        }
        setTimeout(() => { tapCount = 0; }, 3000);
    };

    const quizData = {
        enkyori: [
            { q: "遠距離が始まった日はいつでしょう？", choices: ["3月の3週目", "3月の4週目"], a: 1, img: "images/1.jpg", comment: "3/27が最終日。ギリギリまで粘ったのが懐かしい。。" },
            { q: "遠距離が始まる前に食べた晩御飯は何でしょう？", choices: ["ピザ", "牛タン"], a: 1, img: "images/2.jpg", comment: "また食べに行きたい。一緒に行こう！！" },
            { q: "遠距離が始まって最初に訪れた場所はどこでしょう？", choices: ["大阪城公園", "小動物カフェ"], a: 0, img: "images/3.jpg", comment: "ピクニックの良さに気付いた日！" },
            { q: "遠距離になってから2人で訪れた旅行先は合計何県でしょう？（大阪、愛媛を除く）", choices: ["７", "１１", "１３"], a: 1, img: "images/4.jpg", comment: "愛知、香川、沖縄、滋賀、岐阜、福岡、佐賀、長崎、石川、福井、三重に行きました！目指せ全国制覇！" },
            { q: "遠距離になってからかわとやまは合計何回飛行機に乗ったでしょう？", choices: ["72回", "82回", "92回"], a: 2, img: "images/5.jpg", comment: "大阪26回、愛媛17回、沖縄1回、福岡1回、東京1回の内訳。ANAありがとう。。\nちなみに香川は4回。" },
            { q: "遠距離を始めてから同棲開始までどれくらいの日付が経ったでしょう？", choices: ["585日", "685日", "785日"], a: 2, img: "images/6.jpg", comment: "約6782万秒耐えたらしい。すごい。" },
            { q: "やまはなぜ奈良に行く決断ができたでしょう？", choices: ["かわと一緒に過ごしていきたいから。", "なんとなく。"], a: 0, img: "images/7.jpg", comment: "一緒に幸せに過ごしていこうね！" }
        ]
    };

    let currentCourse = [];
    let currentIndex = 0;

    function startCourse(courseId) {
        currentCourse = quizData[courseId];
        if (!currentCourse || currentCourse.length === 0) return;
        currentIndex = 0;
        document.getElementById('course-select').classList.add('hidden');
        document.getElementById('quiz-screen').classList.remove('hidden');
        showQuestion();
    }

    function showQuestion() {
        const q = currentCourse[currentIndex];
        document.getElementById('question-count').innerText = `第 ${currentIndex + 1} 問 / 全 ${currentCourse.length} 問`;
        document.getElementById('question-text').innerText = q.q;
        document.getElementById('answer-area').classList.add('hidden');
        const choicesArea = document.getElementById('choices-area');
        choicesArea.innerHTML = '';
        choicesArea.classList.remove('hidden');

        q.choices.forEach((choice, idx) => {
            const btn = document.createElement('button');
            btn.className = 'btn btn-choice';
            btn.innerText = choice;
            btn.onclick = () => checkAnswer(idx);
            choicesArea.appendChild(btn);
        });
    }

    function checkAnswer(choiceIdx) {
        const q = currentCourse[currentIndex];
        const feedback = document.getElementById('feedback');
        
        if (choiceIdx === q.a) {
            document.getElementById('choices-area').classList.add('hidden');
            document.getElementById('answer-area').classList.remove('hidden');
            feedback.innerText = "⭕️ 正解！！";
            feedback.style.color = "#4caf50";
            document.getElementById('quiz-image').src = q.img;
            document.getElementById('comment-text').innerText = q.comment;
            createConfetti(25);
        } else {
            feedback.innerText = "❌ 不正解。。";
            feedback.style.color = "#f44336";
            const choicesArea = document.getElementById('choices-area');
            if(!document.getElementById('feedback-temp')){
                const temp = document.createElement('div');
                temp.id = 'feedback-temp';
                choicesArea.prepend(temp);
            }
            document.getElementById('feedback-temp').innerText = "❌ もう一度選んでね！";
            document.getElementById('feedback-temp').style.color = "red";
        }
    }

    function nextQuestion() {
        currentIndex++;
        if (currentIndex < currentCourse.length) {
            showQuestion();
        } else {
            showFinalScreen();
        }
    }

    function showFinalScreen() {
        document.getElementById('quiz-screen').classList.add('hidden');
        document.getElementById('result-screen').classList.remove('hidden');
        let count = 0;
        const interval = setInterval(() => {
            createConfetti(40);
            count++;
            if(count > 6) clearInterval(interval);
        }, 500);
    }

    function createConfetti(num) {
        for (let i = 0; i < num; i++) {
            const confetti = document.createElement('div');
            confetti.className = 'confetti';
            confetti.style.left = Math.random() * 100 + 'vw';
            confetti.style.top = '-10px';
            confetti.style.backgroundColor = `hsl(${Math.random() * 360}, 100%, 70%)`;
            document.body.appendChild(confetti);
            const animation = confetti.animate([
                { transform: 'translate3d(0,0,0) rotate(0deg)', opacity: 1 },
                { transform: `translate3d(${(Math.random()-0.5)*200}px, 100vh, 0) rotate(${Math.random()*360}deg)`, opacity: 0 }
            ], { duration: 2000 + Math.random() * 1000, easing: 'cubic-bezier(0, .9, .57, 1)' });
            animation.onfinish = () => confetti.remove();
        }
    }
</script>
</body>
</html>
